<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feGaussianBlur stdDeviation="40" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#0a0a0a" rx="128" />
  <g filter="url(#neon-glow)">
    <path d="M 170 380 L 256 120 L 342 380" fill="none" stroke="#00f0ff" stroke-width="45" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 205 280 L 307 280" fill="none" stroke="#00f0ff" stroke-width="45" stroke-linecap="round" />
  </g>
  <!-- Inner bright core to make it look really glowing -->
  <path d="M 170 380 L 256 120 L 342 380" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 205 280 L 307 280" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" />
</svg>